org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Phase 5.10: Jetifier is a legacy migrator for pre-AndroidX (support-library)
# dependencies. Every plugin in this app - file_picker 8.x, share_plus 10.x,
# path_provider 2.1.x and the Flutter engine itself - is already AndroidX, so
# Jetifier only cost build time and heap: it ran a JetifyTransform over all six
# Flutter engine ABI jars and exhausted the 2 GB heap on an 8 GB machine.
# If a future dependency does need migrating the build fails loudly with a
# specific "Support library is not AndroidX" error and this can go back to true.
android.enableJetifier=false

kotlin.incremental=false
